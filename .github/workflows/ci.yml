name: ci

on:
  schedule:
    # 每 6 小时运行一次
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  pull_request:
  # 手动触发：GitHub web 按钮 / docker 联机模式 web 端调用
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # fork PR 与所有分支：只跑编译检查与单元测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Syntax check
        run: python -m compileall -q modules main.py
      - name: Run tests
        run: pytest -q

  # 定时任务 / main 推送 / 手动触发：执行完整运行并提交数据回 git
  run:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update GeoIP database (download, not committed)
        run: python main.py config.yaml --update-geo
      - name: Run sub-sift
        run: python main.py config.yaml
      - name: Commit data back to repo (rolling snapshot)
        env:
          # 使用 GITHUB_TOKEN（DESIGN.md §10：优先 GITHUB_TOKEN，不用 PAT）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 竞态兜底：运行期间远端有新提交（如 web 端维护推送）则基于最新重跑，避免覆盖
          git fetch origin
          if ! git diff --quiet origin/main HEAD -- data output; then
            echo "remote has new commits during run, re-run on latest"
            git reset --hard origin/main
            python main.py config.yaml
          fi
          git add data output
          if git diff --cached --quiet; then
            echo "no data changes, skip commit"
            exit 0
          fi
          # 快照滚动提交：HEAD 是快照则 amend（仓库不膨胀），否则新建
          # （功能提交/维护提交之后第一次运行会新建，之后持续 amend）
          if [ "$(git log -1 --format=%s)" = "chore(data): update snapshot [skip ci]" ]; then
            git commit --amend -m "chore(data): update snapshot [skip ci]"
            git push --force-with-lease origin main
          else
            git commit -m "chore(data): update snapshot [skip ci]"
            git push
          fi
