name: ci

on:
  schedule:
    # 每 6 小时运行一次
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # fork PR 与所有分支：只跑编译检查与单元测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Syntax check
        run: python -m compileall -q modules main.py
      - name: Run tests
        run: pytest -q

  # 定时任务与 main 分支推送：执行完整运行并提交数据回 git
  run:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update GeoIP database (download, not committed)
        run: python main.py config.yaml --update-geo
      - name: Run sub-sift
        run: python main.py config.yaml
      - name: Commit data back to repo
        env:
          # 使用 GITHUB_TOKEN（DESIGN.md §10：优先 GITHUB_TOKEN，不用 PAT）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "no data changes, skip commit"
          else
            git commit -m "chore(data): update snapshot [skip ci]"
            git push
          fi
